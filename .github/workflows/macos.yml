name: macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["web/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build Pomelo.app (universal)
        run: ./macos/build.sh

      - name: Package
        run: |
          cd macos/build
          ditto -c -k --keepParent Pomelo.app Pomelo-macOS.zip
          shasum -a 256 Pomelo-macOS.zip | tee Pomelo-macOS.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Pomelo-macOS
          path: |
            macos/build/Pomelo-macOS.zip
            macos/build/Pomelo-macOS.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          1. Download **Pomelo-macOS.zip** below and unzip it.
          2. Move **Pomelo.app** to your Applications folder.
          3. The first time, right-click the app and choose **Open**. Pomelo is ad-hoc signed, not notarized, so macOS asks once.

          Requires macOS 14 Sonoma or later. Runs natively on Apple silicon and Intel.

          Prefer the browser? Use the web app: https://d-henrique.github.io/pomelo/

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what's new.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            macos/build/Pomelo-macOS.zip macos/build/Pomelo-macOS.zip.sha256 \
            --title "Pomelo ${GITHUB_REF_NAME}" --notes-file notes.md
